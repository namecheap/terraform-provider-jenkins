codecov:
  require_ci_to_pass: false

coverage:
  precision: 2
  round: down
  range: "50...80"
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        target: auto
        threshold: 1%

flags:
  unit:
    paths:
      - jenkins/
  acceptance:
    paths:
      - jenkins/

comment:
  layout: "reach,diff,flags"
  behavior: default
