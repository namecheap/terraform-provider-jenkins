# Configuration as Code for the acceptance/integration Jenkins.
#
# securityRealm: Jenkins' own user database with a fixed admin/admin account.
# The provider authenticates as this admin in CI, and the jenkins_user resource
# manages additional local accounts. Signup is disabled.
#
# authorizationStrategy: the Role-Based Authorization Strategy is required by the
# jenkins_role resource. The "admin" user, the "authenticated" group, and
# "anonymous" are all granted Overall/Administer so that effective access is
# unchanged from the pre-realm setup and the existing acceptance/integration
# tests are unaffected.
jenkins:
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"
  authorizationStrategy:
    roleBased:
      roles:
        global:
          - name: "admin"
            description: "Full control. Preserves the pre-role-strategy open access the test suite relies on."
            permissions:
              - "Overall/Administer"
            entries:
              - user: "admin"
              - user: "anonymous"
              - group: "authenticated"
