name: CI

# No workflow-level paths-ignore here, on purpose. This workflow's jobs are
# required status checks, and a path-filtered required check is never reported
# on PRs that touch only excluded files, which blocks them from merging
# permanently. It would also stop versioning.yml's `workflow_run: [CI]` trigger
# from firing on pushes that only touch release files, breaking the
# release-please -> tag -> GoReleaser chain. Instead, the `changes` job below
# detects what changed and the expensive jobs skip themselves via `if:` —
# skipped checks DO satisfy branch protection, and the workflow still completes
# so workflow_run still fires.
on:
  push:
    branches:
      - main
  pull_request:

# Cancel an in-progress PR run when a new commit is pushed to the same branch,
# so superseded runs stop consuming runners. Main/release runs are never
# cancelled (each commit there gets its own run).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Suppress git's "init.defaultBranch" hint that appears on every checkout.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # Gate job: decides whether the jobs below actually need to run for this
  # change. `code` is false only when the diff touches nothing but root-level
  # markdown (README/CHANGELOG/...), LICENSE, or the release-please manifest —
  # most notably the release-please Release PR (CHANGELOG.md +
  # .release-please-manifest.json) and its merge to main, which previously
  # re-ran the full acceptance suite twice per release on code that was
  # already tested. docs/** and templates/** deliberately count as code:
  # docs/ is published to the Terraform Registry at each release tag, so doc
  # changes get the full pipeline like any user-visible change.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter reads PR files via the API on pull_request events
    outputs:
      code: ${{ steps.filter-code.outputs.code }}
    steps:
      # Checkout is required for push events, where paths-filter diffs with git
      # (pull_request events use the API and would not need it).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # With predicate-quantifier=every a file counts as `code` only if it
      # matches ALL patterns, i.e. it is none of the ignored kinds. `*.md`
      # (no globstar) matches root-level markdown only, so nested markdown —
      # docs/**, templates/** — still counts as code on purpose.
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter-code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!*.md'
              - '!LICENSE'
              - '!.release-please-manifest.json'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  # NOTE: CodeQL (Go) lives in codeql.yml, which owns the "CodeQL (go)"
  # required status check. Keep it there: it has its own trigger requirements
  # (schedule, push baseline for alert diffing) that don't fit this workflow.

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC tokenless upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Check coverage threshold
        # This provider relies heavily on acceptance tests for coverage.
        # The threshold guards against removing unit tests entirely, not against
        # a low total (the acceptance job reports ~67% when Jenkins is running).
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=5.0
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: unit
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage.txt
          retention-days: 30

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC tokenless upload
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Cache Jenkins acceptance image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jenkins-acc-image.tar
          key: jenkins-acc-image-${{ hashFiles('integration/Dockerfile') }}

      - name: Build or load Jenkins image
        env:
          COMPOSE_FILE: ./integration/docker-compose.yml
        # On a cache hit, load the prebuilt image tarball (~5s) — no buildx
        # container to spin up, no base-image pull, no plugin download. On a
        # miss, build it once and save the tarball for later runs. Keyed on the
        # Dockerfile so the cache invalidates only when the image changes. This
        # is faster than buildx+gha cache for this small image, whose win was
        # eaten by the ~11s buildx-container setup.
        run: |
          if [ -f /tmp/jenkins-acc-image.tar ]; then
            docker load -i /tmp/jenkins-acc-image.tar
          else
            docker compose build jenkins
            docker save -o /tmp/jenkins-acc-image.tar terraform-provider-jenkins-acc:latest
          fi

      - name: Start Jenkins
        env:
          COMPOSE_FILE: ./integration/docker-compose.yml
        # Start the container detached and DON'T block here. Jenkins boots
        # (~10-13s) in the background while the next steps install Go and
        # compile the tests, so the boot is hidden under work that has to
        # happen anyway instead of being a serial wait.
        run: docker compose up -d --force-recreate jenkins

      # Install Go and restore module/build caches AFTER Jenkins has started,
      # so its boot overlaps this step and the warm compile below.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          JENKINS_URL: "http://localhost:8080"
          JENKINS_USERNAME: "admin"
          # The acceptance Jenkins now runs a local security realm (see
          # integration/jenkins.yaml) with a fixed admin/admin account, matching
          # the integration test and local `make testacc`.
          JENKINS_PASSWORD: "admin"
        run: |
          # Warm the build cache (compile only, run no tests) while Jenkins
          # boots in the background. This overlaps the container startup with
          # compilation instead of waiting for it serially. -covermode=atomic
          # matches the real run's build flags so its compile is a cache hit.
          go test -covermode=atomic -run='^$' ./... >/dev/null
          # By now Jenkins is almost certainly healthy; confirm before running.
          timeout 120 bash -c 'until [ "$(docker inspect jenkins-provider-acc --format "{{ .State.Health.Status }}")" = "healthy" ]; do sleep 2; done'
          go test -v -covermode=atomic -coverprofile=coverage.txt -run "^TestAcc" ./...

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: acceptance
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-coverage
          path: coverage.txt
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go install

      - name: Add terraformrc override
        run: |
          GOBIN_DIR=$(go env GOPATH)/bin
          cat << TFRC > ~/.terraformrc
          provider_installation {
            dev_overrides {
              "namecheap/jenkins" = "$GOBIN_DIR"
            }
            direct {}
          }
          TFRC

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate SSH key for credential tests
        run: ssh-keygen -t ed25519 -N "" -f integration/credentials/id_ed25519

      - name: Init integration
        working-directory: integration/
        # terraform init fails on the jenkins registry lookup; we tolerate that exit code so
        # downstream steps can use the dev_override binary instead.
        run: terraform init || true

      - name: Run integration
        working-directory: integration/
        run: terraform test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          # `make generate` builds the doc tool from the separate tools/ module,
          # so its go.sum must be part of the cache key alongside the root one.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: make generate

      - name: Verify docs are up-to-date
        run: |
          if ! git diff --exit-code docs/; then
            echo "::error::Documentation is out of sync. Run 'make generate' and commit the changes."
            exit 1
          fi

  # Always-run summary job with two purposes:
  # 1. A workflow run whose jobs were ALL skipped by the gate would otherwise
  #    have no executed job, making the run-level conclusion (which gates
  #    versioning.yml via workflow_run) ambiguous. This job always executes,
  #    so the run always concludes success or failure.
  # 2. Branch protection can require just this one check instead of listing
  #    every job: it fails if any needed job failed or was cancelled, and
  #    passes when jobs succeeded or were legitimately skipped by the gate.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [changes, lint, unit, acceptance, integration, docs]
    if: always()
    steps:
      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null
