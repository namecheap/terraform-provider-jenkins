name: CI

# How the jobs fit together, and the invariants to keep when editing this
# file, are in CI.md.
on:
  push:
    branches:
      - main
  pull_request:

# Cancel superseded PR runs; every main run completes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Suppress git's "init.defaultBranch" hint on every checkout.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # paths-filter reads PR files via the API
    outputs:
      code: ${{ steps.filter-code.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # `every`: a file is code unless it is root-level markdown, LICENSE or the
      # release-please manifest. Nested markdown (docs/, templates/) is code.
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter-code
        with:
          predicate-quantifier: 'every'
          filters: |
            code:
              - '!*.md'
              - '!LICENSE'
              - '!.release-please-manifest.json'

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false # own cache below; see "Go caches" in CI.md
      - name: Restore Go module and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-
      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.3.0 ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write  # Codecov OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false # own cache below; see "Go caches" in CI.md
      - name: Restore Go module and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      # A floor against deleting unit tests, not a target; see CI.md.
      - name: Check coverage threshold
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=5.0
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: unit
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-coverage
          path: coverage.txt
          retention-days: 30

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    permissions:
      contents: read
      id-token: write  # Codecov OIDC
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Cache Jenkins acceptance image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/jenkins-acc-image.tar
          key: jenkins-acc-image-${{ hashFiles('integration/Dockerfile') }}

      # Load the cached image tarball, or build and save it on a miss.
      - name: Build or load Jenkins image
        env:
          COMPOSE_FILE: ./integration/docker-compose.yml
        run: |
          if [ -f /tmp/jenkins-acc-image.tar ]; then
            docker load -i /tmp/jenkins-acc-image.tar
          else
            docker compose build jenkins
            docker save -o /tmp/jenkins-acc-image.tar terraform-provider-jenkins-acc:latest
          fi

      # One Jenkins per shard, detached: they boot while Go is set up and the
      # tests compile. See "Acceptance test shards" in CI.md.
      - name: Start Jenkins
        run: .github/scripts/acceptance-shards.sh start

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        id: setup-go
        with:
          go-version-file: go.mod
          cache: false # own cache below; see "Go caches" in CI.md
      - name: Restore Go module and build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ github.job }}-${{ runner.os }}-${{ steps.setup-go.outputs.go-version }}-

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          # Local security realm from integration/jenkins.yaml; the script sets
          # each shard's JENKINS_URL.
          JENKINS_USERNAME: "admin"
          JENKINS_PASSWORD: "admin"
        run: |
          # Compile only, with the real run's flags, while Jenkins boots.
          go test -covermode=atomic -run='^$' ./... >/dev/null
          .github/scripts/acceptance-shards.sh run

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: acceptance
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-coverage
          path: coverage.txt
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    env:
      TF_IN_AUTOMATION: "1" # drops Terraform's interactive hints
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binary
        run: go install

      - name: Add terraformrc override
        run: |
          GOBIN_DIR=$(go env GOPATH)/bin
          cat << TFRC > ~/.terraformrc
          provider_installation {
            dev_overrides {
              "namecheap/jenkins" = "$GOBIN_DIR"
            }
            direct {}
          }
          TFRC

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate SSH key for credential tests
        run: ssh-keygen -t ed25519 -N "" -f integration/credentials/id_ed25519

      # The "Provider development overrides are in effect" warning is expected.
      - name: Init integration
        working-directory: integration/
        run: terraform init -input=false -lockfile=readonly

      - name: Run integration
        working-directory: integration/
        run: terraform test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.code == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          cache: true
          # `make generate` builds the doc tool from the tools/ module.
          cache-dependency-path: |
            go.sum
            tools/go.sum
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: make generate

      - name: Verify docs are up-to-date
        run: |
          if ! git diff --exit-code docs/; then
            echo "::error::Documentation is out of sync. Run 'make generate' and commit the changes."
            exit 1
          fi

  # The required "CI OK" check; see CI.md. Every other job must be in `needs`.
  ci-ok:
    name: CI OK
    runs-on: ubuntu-latest
    needs: [changes, lint, unit, acceptance, integration, docs]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Assert every job is watched by this gate
        run: |
          watched=$(yq '.jobs.ci-ok.needs[]' .github/workflows/test.yml | sort)
          all=$(yq '.jobs | keys | .[]' .github/workflows/test.yml | grep -vx 'ci-ok' | sort)
          if ! diff <(echo "$all") <(echo "$watched"); then
            echo "::error::test.yml jobs and ci-ok's needs list have drifted (< missing from needs, > stale entry)."
            exit 1
          fi

      - name: Check results of all jobs
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if ! echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success" or .value.result == "skipped")' > /dev/null; then
            echo "::error::One or more CI jobs failed or were cancelled — see the results above."
            exit 1
          fi
