name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"

permissions:
  contents: read

# Suppress git's "init.defaultBranch" hint that appears on every checkout.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: v2.12
      - name: govulncheck
        # Reports vulnerabilities; continue-on-error keeps stdlib vulns from
        # blocking PRs until Go itself is upgraded to include the fix.
        continue-on-error: true
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC tokenless upload
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - run: go mod download

      - name: Test with coverage
        run: go test -race -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Check coverage threshold
        # This provider relies heavily on acceptance tests for coverage.
        # The threshold guards against removing unit tests entirely, not against
        # a low total (the acceptance job reports ~67% when Jenkins is running).
        run: |
          COVERAGE=$(go tool cover -func=coverage.txt | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: ${COVERAGE}%"
          THRESHOLD=5.0
          if [ "$(echo "${COVERAGE} < ${THRESHOLD}" | bc -l)" -eq 1 ]; then
            echo "::error::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
            exit 1
          fi

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: unit
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-coverage
          path: coverage.txt
          retention-days: 30

  acceptance:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # required for Codecov OIDC tokenless upload
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - run: go mod download

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Set up services
        env:
          COMPOSE_FILE: ./integration/docker-compose.yml
        run: |
          docker compose build
          docker compose up -d --force-recreate jenkins
          while [ "$(docker inspect jenkins-provider-acc --format '{{ .State.Health.Status }}')" != "healthy" ]; do
            echo "Waiting for Jenkins to start..."
            sleep 3
          done

      - name: Run acceptance tests
        env:
          TF_ACC: "1"
          JENKINS_URL: "http://localhost:8080"
          JENKINS_USERNAME: "admin"
          JENKINS_PASSWORD: ${{ secrets.JENKINS_PASSWORD || 'admin' }}
        run: go test -v -covermode=atomic -coverprofile=coverage.txt ./...

      - name: Trust Codecov GPG key
        run: echo "27034E7FDB850E0BBC2C62FF806BB28AED779869:6:" | gpg --import-ownertrust

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: namecheap/terraform-provider-jenkins
          files: coverage.txt
          flags: acceptance
          fail_ci_if_error: false
          disable_search: true
          plugins: noop

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-coverage
          path: coverage.txt
          retention-days: 30

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Build binary
        run: go install

      - name: Add terraformrc override
        run: |
          GOBIN_DIR=$(go env GOPATH)/bin
          cat << TFRC > ~/.terraformrc
          provider_installation {
            dev_overrides {
              "namecheap/jenkins" = "$GOBIN_DIR"
            }
            direct {}
          }
          TFRC

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate SSH key for credential tests
        run: ssh-keygen -t ed25519 -N "" -f integration/credentials/id_ed25519

      - name: Init integration
        working-directory: integration/
        # terraform init fails on the jenkins registry lookup; we tolerate that exit code so
        # downstream steps can use the dev_override binary instead.
        run: terraform init || true

      - name: Run integration
        working-directory: integration/
        run: terraform test

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Generate docs
        run: make generate

      - name: Verify docs are up-to-date
        run: |
          if ! git diff --exit-code docs/; then
            echo "::error::Documentation is out of sync. Run 'make generate' and commit the changes."
            exit 1
          fi
