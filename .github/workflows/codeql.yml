name: CodeQL (advanced)

# The org-enforced default setup ("Analyze (go)") is skipped entirely on
# Dependabot pull requests: Dependabot-triggered runs get a read-only
# GITHUB_TOKEN, which cannot upload code scanning results. Its status check is
# then never reported, so a Dependabot PR with a required "Analyze (go)" check
# can never merge. This repo-owned advanced setup owns the "CodeQL (go)" merge
# gate instead: the pull_request event is always permitted to upload results,
# so it reports on every PR, Dependabot's and forks' included.
on:
  # Do NOT add paths/paths-ignore filters here. This job is a required status
  # check, and a path-filtered required check is never reported on PRs that
  # touch only excluded files, which blocks them from merging permanently.
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel an in-progress PR run when a new commit is pushed to the same branch.
# Main and scheduled runs are never cancelled, so every commit on main keeps
# its own analysis for pull request alert diffing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze:
    # This name is a required status check in branch protection on main, so
    # renaming it here orphans that check and blocks every PR. Rename it only
    # together with protection; CI's `required-checks` job fails on orphans.
    name: CodeQL (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: go
          queries: security-and-quality

      - name: Build
        run: go build .

      # Uploads under a category of its own so this analysis and the
      # org default-setup analysis never overwrite each other.
      #
      # Do NOT change this value. Code scanning identifies a configuration
      # by (tool, workflow job, category), so editing the category does not
      # rename the existing configuration — it creates a new one and orphans
      # the old. GitHub keeps expecting the orphan on refs/heads/main, never
      # finds it on a PR head, and reports "N configurations not found"
      # instead of the alert diff on every pull request. Recovering means
      # deleting the orphan's analyses through
      # DELETE /repos/{owner}/{repo}/code-scanning/analyses/{id}, newest
      # first: only one is deletable at a time, in timestamp order across
      # every analysis that shares the abandoned category.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: "/language:go/config:advanced"
