name: CodeQL (advanced)

# The org-enforced default setup ("Analyze (go)") is skipped entirely on
# Dependabot pull requests: Dependabot-triggered runs get a read-only
# GITHUB_TOKEN, which cannot upload code scanning results. Its status check is
# then never reported, so a Dependabot PR with a required "Analyze (go)" check
# can never merge. This repo-owned advanced setup owns the "CodeQL (go)" merge
# gate instead: the pull_request event is always permitted to upload results,
# so it reports on every PR, Dependabot's and forks' included.
on:
  # Do NOT add paths/paths-ignore filters here. This job is a required status
  # check, and a path-filtered required check is never reported on PRs that
  # touch only excluded files, which blocks them from merging permanently.
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

# Cancel an in-progress PR run when a new commit is pushed to the same branch.
# Main and scheduled runs are never cancelled, so every commit on main keeps
# its own analysis for pull request alert diffing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  analyze:
    name: CodeQL (go)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      CODEQL_ACTION_FILE_COVERAGE_ON_PRS: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          check-latest: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: go
          queries: security-and-quality

      - name: Build
        run: go build .

      # Uploads under a category of its own so this analysis and the
      # org default-setup analysis never overwrite each other.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:go/config:advanced"
