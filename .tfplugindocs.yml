# Configuration for tfplugindocs
# https://github.com/hashicorp/terraform-plugin-docs
#
# Without this file, tfplugindocs derives the provider name from the binary
# name (terraform-provider-jenkins-v2 → jenkins-v2), which mismatches the
# actual resource type prefix used in the provider schema (jenkins_*).
provider-name: jenkins

rendered-provider-name: Jenkins
legacy-sidebar: false
hide-deprecated: false
