# Configuration for tfplugindocs
# https://github.com/hashicorp/terraform-plugin-docs
#
# Sets the provider name used in docs page titles and resource headings.
# The binary is terraform-provider-jenkins, so tfplugindocs auto-derives
# "jenkins" — this file makes the setting explicit.
provider-name: jenkins

rendered-provider-name: Jenkins
legacy-sidebar: false
hide-deprecated: false
